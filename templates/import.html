<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Import recipe text</title>
</head>
<body>
  <h1>Import recipe text</h1>
  {% if error %}
    <p style="color:red">{{ error }}</p>
  {% endif %}
  <form method="post">
    <p>
      <label>Optional title override:<br>
      <input type="text" name="title" size="80"></label>
    </p>
    <p>
      <label>Paste text or HTML for the recipe:<br>
      <textarea name="text" rows="20" cols="100"></textarea></label>
    </p>
    <p>
      <button type="submit">Analyze</button>
      <a href="/">Cancel</a>
    </p>
  </form>
</body>
</html>
